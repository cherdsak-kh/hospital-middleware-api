services:
  db:
    image: postgres:15-alpine
    container_name: hospital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: hospital_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_middleware_api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres_user
      DB_PASSWORD: postgres_password
      DB_NAME: hospital_db
      DB_SSLMODE: disable
      JWT_SECRET: f4fb54375319c1e7a2f7b7ee9fd4333a0fa55368078b20d2c3cb796050176b02
      JWT_EXPIRY_HOURS: 24
      HOSPITAL_A_BASE_URL: https://hospital-a.api.co.th
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: hospital_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app

volumes:
  postgres_data:
